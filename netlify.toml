[[redirects]]
from = "https://dirtystylus.com/*"
to = "https://markllobrera.com/:splat"
status = 301
force = true

[[redirects]]
from = "https://www.dirtystylus.com/*"
to = "https://markllobrera.com/:splat"
status = 301
force = true

[[redirects]]
from = "/:year/:month/:date/:slug"
to = "/posts/:slug"
status = 301

[[plugins]]
package = "netlify-plugin-cache"

  [plugins.inputs]
  paths = [ ".cache" ]

[[headers]]
	for = "/feed/feed.xml"
	[headers.values]
		Cache-Control = "public, max-age=3600"

[[headers]]
	for = "/*"
	[headers.values]
		X-Robots-Tag = "noai, noimageai"
		X-Content-Type-Options = "nosniff"
